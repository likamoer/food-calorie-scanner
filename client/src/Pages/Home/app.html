<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panna Cotta Recipe</title>
  <!-- 引入Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义颜色和字体 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#000000',
            secondary: '#333333',
            accent: '#FF6B35',
            light: 'rgba(255, 255, 255, 0.9)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      /* 毛玻璃效果工具类 */
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      /* 卡片阴影 */
      .card-shadow {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      /* 营养标签样式 */
      .nutrition-tag {
        @apply bg-gray-100 rounded-full px-4 py-1 text-sm font-medium;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
  <!-- 背景图片 -->
  <div class="fixed inset-0 -z-10">
    <img src="https://picsum.photos/id/431/800/1200" alt="Dessert background" 
         class="w-full h-full object-cover opacity-80">
  </div>

  <!-- 顶部导航栏（毛玻璃效果） -->
  <header class="glass fixed top-0 left-0 right-0 z-50 h-16 flex items-center justify-center">
    <div class="absolute left-4">
      <button class="text-primary p-2">
        <i class="fa fa-arrow-left text-xl"></i>
      </button>
    </div>
    <h1 class="text-lg font-semibold text-primary">Dessert Details</h1>
    <div class="absolute right-4 w-8"></div> <!-- 占位元素保持居中 -->
  </header>

  <!-- 主内容卡片 -->
  <main class="max-w-md mx-auto pt-16 pb-20">
    <!-- 顶部图片区域 -->
    <div class="h-56 overflow-hidden rounded-t-3xl relative">
      <img src="https://picsum.photos/id/292/800/600" alt="Panna Cotta" 
           class="w-full h-full object-cover">
      <!-- 顶部图片底部渐变遮罩 -->
      <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-white to-transparent"></div>
    </div>

    <!-- 卡片内容（毛玻璃效果） -->
    <div class="glass rounded-b-3xl -mt-1 card-shadow p-6">
      <!-- 标题和热量 -->
      <div class="flex justify-between items-start mb-6">
        <h2 class="text-[clamp(1.5rem,5vw,2rem)] font-bold text-primary">Panna Cotta</h2>
        <div class="flex items-center gap-1.5">
          <i class="fa fa-fire text-accent"></i>
          <span class="text-lg font-medium text-primary">260 kcal</span>
        </div>
      </div>

      <!-- 营养成分标签 -->
      <div class="flex flex-wrap gap-2.5 mb-6">
        <div class="nutrition-tag">
          Protein: <span class="font-bold text-primary">12g</span>
        </div>
        <div class="nutrition-tag">
          Carbs: <span class="font-bold text-primary">24g</span>
        </div>
        <div class="nutrition-tag">
          Fat: <span class="font-bold text-primary">20g</span>
        </div>
      </div>

      <!-- 描述文本 -->
      <p class="text-secondary mb-8 leading-relaxed">
        Chocolate panna cotta is a smooth and creamy Italian dessert made with cream, sugar, and rich dark chocolate... 
        <span class="text-accent font-medium cursor-pointer hover:underline">Read more</span>
      </p>

      <!-- 原料部分 -->
      <h3 class="text-xl font-bold text-primary mb-4">Ingredients</h3>
      <div class="grid grid-cols-4 gap-3 mb-10">
        <div class="flex flex-col items-center">
          <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-2">
            <img src="https://picsum.photos/id/431/100/100" alt="Chocolate" class="w-10 h-10 object-contain">
          </div>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-2">
            <img src="https://picsum.photos/id/132/100/100" alt="Milk" class="w-10 h-10 object-contain">
          </div>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-2">
            <img src="https://picsum.photos/id/1080/100/100" alt="Cherries" class="w-10 h-10 object-contain">
          </div>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-2">
            <img src="https://picsum.photos/id/174/100/100" alt="Cream" class="w-10 h-10 object-contain">
          </div>
        </div>
      </div>

      <!-- 底部按钮 -->
      <div class="flex gap-3">
        <button class="flex-1 bg-primary text-white py-4 px-6 rounded-full font-medium text-lg 
                       hover:bg-opacity-90 transition-all duration-300">
          Add meal
        </button>
        <button class="w-14 h-14 rounded-full border border-gray-300 flex items-center justify-center
                       hover:bg-gray-100 transition-all duration-300">
          <i class="fa fa-bookmark-o text-primary text-xl"></i>
        </button>
      </div>
    </div>
  </main>

  <script>
    // 简单的交互效果
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', function() {
        this.classList.add('scale-95');
        setTimeout(() => this.classList.remove('scale-95'), 200);
      });
    });
  </script>
</body>
</html>
